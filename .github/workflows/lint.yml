name: Lint

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: yamllint + ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      # Both linters are run from ansible/ so ansible.cfg supplies module/role
      # context and the local .yamllint / .ansible-lint configs are discovered.
      # This mirrors exactly what `cd ansible && uv run <linter>` does locally.
      - name: yamllint
        working-directory: ansible
        run: uv run yamllint .

      - name: ansible-lint
        working-directory: ansible
        run: uv run ansible-lint
