---
- name: Install pmix
  vars:
    pmix_dir: "{{ common_dir }}/pmix"
    pmix_module_dir: "{{ common_modules }}/pmix"
    url: "{{ item.url }}"
    version_number: "{{ item.version_number }}"
    checksum: "{{ item.checksum }}"
    install_dir: "{{ pmix_dir }}/{{ version_number }}"
    unzipdir: "/dev/shm/pmix-{{ version_number }}"
    build_dir: "{{ unzipdir }}/build"
    hwloc: "{{ item.hwloc }}"
  tags:
    - never
    - pmix{{ item.version_number }}
  block:
    - name: Install pmix {{ version_number }}
      block:
        - name: Download, compile and install pmix {{ version_number }}
          block:
            - name: Download pmix {{ version_number }}
              ansible.builtin.get_url:
                url: "{{ url }}"
                dest: "{{ common_src }}/pmix-{{ version_number }}.tar.gz"
                checksum: "{{ checksum }}"
                mode: u=rw,g=r,o=r
            - name: Unzip pmix {{ version_number }}
              ansible.builtin.unarchive:
                src: "{{ common_src }}/pmix-{{ version_number }}.tar.gz"
                dest: "/dev/shm/"
                creates: "{{ unzipdir }}"
            - name: Make pmix build directory {{ version_number }}
              ansible.builtin.file:
                path: "{{ build_dir }}"
                state: directory
                mode: u=rwx,g=rwx,o=rx
            - name: Run pmix configure {{ version_number }}
              ansible.builtin.command: "../configure --prefix={{ install_dir }} --enable-static --with-slurm --with-hwloc={{ hwloc }}"
              args:
                chdir: "{{ build_dir }}"
                creates: "{{ build_dir }}/Makefile"
            - name: Build pmix {{ version_number }}
              community.general.make:
                chdir: "{{ build_dir }}"
              environment:
                MAKEFLAGS: "-j {{  ansible_facts['processor_vcpus'] }}"
            - name: Install pmix {{ version_number }}
              community.general.make:
                chdir: "{{ build_dir }}"
                target: install

    - name: Install pmix module {{ version_number }}
      block:
        - name: Check module dir
          ansible.builtin.file:
            path: "{{ pmix_module_dir }}"
            state: directory
            mode: u=rwx,g=rwx,o=rx
        - name: Install pmix module file {{ version_number }}
          ansible.builtin.template:
            src: pmix.lua
            dest: "{{ pmix_module_dir }}/{{ version_number }}.lua"
            mode: u=rw,g=r,o=r
