---
- name: Install Mamba {{ item.version_number }}
  vars:
    mamba_dir: "{{ common_dir }}/mamba"
    mamba_module_dir: "{{ common_modules }}/mamba"
    version_number: "{{ item.version_number }}"
    install_dir: "{{ mamba_dir }}/{{ version_number }}"
    micromamba_binary: "{{ common_src }}/micromamba-{{ item.micromamba_version }}-linux-64"
  tags:
    - never
    - mamba{{ item.version_number }}
  block:
    - name: Download micromamba bootstrap binary {{ item.micromamba_version }}
      ansible.builtin.get_url:
        url: "{{ item.micromamba_url }}"
        dest: "{{ micromamba_binary }}"
        checksum: "{{ item.micromamba_checksum }}"
        mode: u=rwx,g=rx,o=rx

    # The package cache must not sit at a predictable path in world-writable /dev/shm:
    # another user could pre-seed it with tampered packages that end up in /software.
    # tempfile gives a randomly named 0700 dir; `always` removes it even on failure.
    - name: Create Mamba base environment {{ version_number }}
      block:
        - name: Create private bootstrap root prefix {{ version_number }}
          ansible.builtin.tempfile:
            state: directory
            path: /dev/shm
            prefix: mamba-bootstrap-
          register: mamba_bootstrap_root

        # --no-rc keeps the build host's own condarc out of the solve.
        - name: Solve and install Mamba base environment {{ version_number }}
          ansible.builtin.command:
            argv:
              - "{{ micromamba_binary }}"
              - create
              - --yes
              - --no-rc
              - --override-channels
              - --channel
              - conda-forge
              - --root-prefix
              - "{{ mamba_bootstrap_root.path }}"
              - --prefix
              - "{{ install_dir }}"
              - "mamba={{ version_number }}"
              - conda
              - python
              - pip
            creates: "{{ install_dir }}/bin/mamba"
      always:
        - name: Remove bootstrap root prefix {{ version_number }}
          ansible.builtin.file:
            path: "{{ mamba_bootstrap_root.path }}"
            state: absent
          when: mamba_bootstrap_root.path is defined

    - name: Add condarc to Mamba base environment {{ version_number }}
      ansible.builtin.template:
        src: common/mamba.condarc
        dest: "{{ install_dir }}/condarc"
        mode: u=rw,g=r,o=r

    - name: Check module dir {{ mamba_module_dir }}
      ansible.builtin.file:
        path: "{{ mamba_module_dir }}"
        state: directory
        mode: u=rwx,g=rwx,o=rx

    - name: Install Mamba module file {{ version_number }}
      ansible.builtin.template:
        src: common/mamba.lua
        dest: "{{ mamba_module_dir }}/{{ version_number }}.lua"
        mode: u=rw,g=r,o=r

    # Lmod picks the highest version as default, and the older installer-versioned
    # modules (23.3.1-0, 24.11.0-1) sort above 2.x — so pin the default explicitly.
    - name: Set default Mamba module {{ version_number }}
      ansible.builtin.copy:
        content: |
          module_version("mamba/{{ version_number }}", "default")
        dest: "{{ mamba_module_dir }}/.modulerc.lua"
        mode: u=rw,g=r,o=r
      when: item.is_default | default(false)
