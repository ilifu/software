---
- name: Install dotnet
  vars:
    dotnet_dir: "{{ common_dir }}/dotnet"
    dotnet_module_dir: "{{ common_modules }}/dotnet"
    url: "{{ item.url }}"
    version_number: "{{ item.version_number }}"
    checksum: "{{ item.checksum }}"
    install_dir: "{{ dotnet_dir }}/{{ version_number }}"
  tags:
    - never
    - dotnet{{ item.version_number }}
  block:
    - name: Download dotnet {{ version_number }}
      ansible.builtin.get_url:
        url: "{{ url }}"
        dest: "{{ common_src }}/dotnet-{{ version_number }}.tar.gz"
        checksum: "{{ checksum }}"
        mode: u=rw,g=r,o=r
    - name: Ensure installation parent exists {{ dotnet_dir }}
      ansible.builtin.file:
        path: "{{ dotnet_dir }}"
        state: directory
        mode: u=rwx,g=rx,o=rx
    - name: Ensure installation directory exists {{ install_dir }}
      ansible.builtin.file:
        path: "{{ install_dir }}"
        state: directory
        mode: u=rwx,g=rx,o=rx
    - name: Unzip dotnet {{ version_number }} to {{ install_dir }}
      ansible.builtin.unarchive:
        src: "{{ common_src }}/dotnet-{{ version_number }}.tar.gz"
        dest: "{{ install_dir }}"
        creates: "{{ install_dir }}/dotnet"

    - name: Install dotnet module {{ version_number }}
      block:
        - name: Check module dir
          ansible.builtin.file:
            path: "{{ dotnet_module_dir }}"
            state: directory
            mode: u=rwx,g=rwx,o=rx
        - name: Install dotnet module file {{ version_number }}
          ansible.builtin.template:
            src: dotnet.lua
            dest: "{{ dotnet_module_dir }}/{{ version_number }}.lua"
            mode: u=rw,g=r,o=r
