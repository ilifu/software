---
- name: Install OpenMPI
  vars:
    mpi_dir: "{{ common_dir }}/openmpi"
    mpi_module_dir: "{{ common_modules }}/openmpi"
    url: "{{ item.url }}"
    version_number: "{{ item.version_number }}"
    checksum: "{{ item.checksum }}"
    install_dir: "{{ mpi_dir }}/{{ version_number }}"
    install_dir_gpu: "{{ mpi_dir }}/{{ version_number }}_gpu"
    unzipdir: "/dev/shm/openmpi-{{ version_number }}"
    build_dir: "{{ unzipdir }}/build"
    ucx_dir: "{{ common_dir }}/ucx/{{ item.ucx_version }}"
    singularity_dir: "{{ common_dir }}/singularity/{{ item.singularity_version }}"
    cuda_root: "{{ item.cuda_root }}"
    cuda_module: "{{ item.cuda_module }}"
  tags:
    - never
    - openmpi{{ item.version_number }}
  environment:
    MAKEFLAGS: "-j {{ ansible_facts['processor_vcpus'] }}"
  block:
    - name: Install OpenMPI {{ version_number }}
      block:
        - name: Download, compile and install OpenMPI {{ version_number }}
          block:
            - name: Download OpenMPI {{ version_number }}
              ansible.builtin.get_url:
                url: "{{ url }}"
                dest: "{{ common_src }}/openmpi-{{ version_number }}.tar.bz2"
                checksum: "{{ checksum }}"
                mode: u=rw,g=r,o=r
            - name: Unzip OpenMPI {{ version_number }}
              ansible.builtin.unarchive:
                src: "{{ common_src }}/openmpi-{{ version_number }}.tar.bz2"
                dest: "/dev/shm/"
                creates: "{{ unzipdir }}"
            - name: Make OpenMPI build directory {{ version_number }}
              ansible.builtin.file:
                path: "{{ build_dir }}"
                state: directory
                mode: u=rwx,g=rwx,o=rx
            - name: Run OpenMPI configure ( 4.1.4 and below ) {{ version_number }}
              when: item.version_number < "4.1.5"
              ansible.builtin.command: "../configure --prefix={{ install_dir }} --enable-static --with-singularity={{ singularity_dir }} --with-ucx={{ ucx_dir }}
                --with-cuda={{ cuda_root }} --with-pmix=/opt/slurm --with-pmi-libdir=/opt/slurm/lib"
              args:
                chdir: "{{ build_dir }}"
                creates: "{{ build_dir }}/Makefile"
            - name: Run OpenMPI configure ( 4.1.5 and above ) {{ version_number }}
              when: item.version_number >= "4.1.5"
              block:
                - name: Configure OpenMPI for gpu {{ version_number }}
                  ansible.builtin.command: "../configure --prefix={{ install_dir_gpu }} --enable-static --with-singularity={{ singularity_dir }} --with-ucx={{ ucx_dir
                    }} --with-cuda={{ cuda_root }} --with-pmix={{ item.pmix }} --with-pmix-libdir={{ item.pmix }}/lib"
                  args:
                    chdir: "{{ build_dir }}"
                    creates: "{{ build_dir }}/Makefile"
                - name: Build OpenMPI with gpu {{ version_number }}
                  community.general.make:
                    chdir: "{{ build_dir }}"
                - name: Install OpenMPI with gpu {{ version_number }}
                  community.general.make:
                    chdir: "{{ build_dir }}"
                    target: install
                - name: Run Make Clean
                  ansible.builtin.command: "make clean"
                  args:
                    chdir: "{{ build_dir }}"
                - name: Clean OpenMPI gpu Makefile {{ version_number }}
                  ansible.builtin.file:
                    path: "{{ build_dir }}/Makefile"
                    state: absent
                - name: Configure OpenMPI for no gpu {{ version_number }}
                  ansible.builtin.command: "../configure --prefix={{ install_dir }} --enable-static --with-singularity={{ singularity_dir }} --with-ucx={{ ucx_dir
                    }} --with-pmix={{ item.pmix }} --with-pmix-libdir={{ item.pmix }}/lib"
                  args:
                    chdir: "{{ build_dir }}"
                    creates: "{{ build_dir }}/Makefile"
                - name: Build OpenMPI with no gpu {{ version_number }}
                  community.general.make:
                    chdir: "{{ build_dir }}"
                - name: Install OpenMPI with no gpu {{ version_number }}
                  community.general.make:
                    chdir: "{{ build_dir }}"
                    target: install

    - name: Install OpenMPI module {{ version_number }}
      block:
        - name: Check module dir
          ansible.builtin.file:
            path: "{{ mpi_module_dir }}"
            state: directory
            mode: u=rwx,g=rwx,o=rx
        - name: Install OpenMPI gpu module file
          vars:
            gpu: true
          ansible.builtin.template:
            src: openmpi.lua
            dest: "{{ mpi_module_dir }}/{{ version_number }}_gpu.lua"
            mode: u=rw,g=r,o=r
        - name: Install OpenMPI no gpu module file
          vars:
            gpu: false
          ansible.builtin.template:
            src: openmpi.lua
            dest: "{{ mpi_module_dir }}/{{ version_number }}.lua"
            mode: u=rw,g=r,o=r
