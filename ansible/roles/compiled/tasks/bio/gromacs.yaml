---
- name: Install GROMACS
  vars:
    gromacs_dir: "{{ bio_dir }}/gromacs"
    gromacs_module_dir: "{{ bio_modules }}/gromacs"
    url: "{{ item.url }}"
    version_number: "{{ item.version_number }}"
    checksum: "{{ item.checksum }}"
    install_dir: "{{ gromacs_dir }}/{{ version_number }}"
    unzipdir: "/dev/shm/gromacs-{{ version_number }}"
    build_dir: "{{ unzipdir }}/build"
    cuda_root: "{{ item.cuda_root }}"
    cuda_module: "{{ item.cuda_module }}"
    #    mpi_module: "{{ item.mpi_module }}"
    hwloc_module: "{{ item.hwloc_module }}"
    #    mpi_root: "{{ item.mpi_root }}"
    hwloc_root: "{{ item.hwloc_root }}"
  tags:
    - never
    - gromacs{{ item.version_number }}
  environment:
    #    PATH: "{{ cuda_root }}/bin:{{ mpi_root }}/bin:{{ hwloc_root }}/bin:{{ ansible_facts['env'].PATH }}"
    #    INCLUDE: "{{ cuda_root }}/include:{{ mpi_root }}/include:{{ hwloc_root }}/include{% if 'INCLUDE' in ansible_facts['env'] %}:{{ ansible_facts['env'].INCLUDE }}{% endif %}"
    #    LD_LIBRARY_PATH: "{{ cuda_root }}/lib64:{{ mpi_root }}/lib:{{ hwloc_root }}/lib{% if 'LD_LIBRARY_PATH' in ansible_facts['env'] %}:{{ ansible_facts['env'].LD_LIBRARY_PATH }}{% endif %}"
    #    PKG_CONFIG_PATH: "{{ cuda_root }}/pkgconfig:{{ mpi_root }}/lib/pkgconfig:{{ hwloc_root }}/lib/pkgconfig{% if 'PKG_CONFIG_PATH' in ansible_facts['env'] %}:{{ ansible_facts['env'].PKG_CONFIG_PATH }}{% endif %}"
    PATH: "{{ cuda_root }}/bin:{{ hwloc_root }}/bin:{{ ansible_facts['env'].PATH }}"
    INCLUDE: "{{ cuda_root }}/include:{{ hwloc_root }}/include{% if 'INCLUDE' in ansible_facts['env'] %}:{{ ansible_facts['env'].INCLUDE }}{% endif %}"
    LD_LIBRARY_PATH: "{{ cuda_root }}/lib64:{{ hwloc_root }}/lib{% if 'LD_LIBRARY_PATH' in ansible_facts['env'] %}:{{ ansible_facts['env'].LD_LIBRARY_PATH }}{% endif %}"
    PKG_CONFIG_PATH: "{{ cuda_root }}/pkgconfig:{{ hwloc_root }}/lib/pkgconfig{% if 'PKG_CONFIG_PATH' in ansible_facts['env'] %}:{{ ansible_facts['env'].PKG_CONFIG_PATH }}{% endif
      %}"
    MAKEFLAGS: "-j {{ ansible_facts['processor_vcpus'] }}"
  #    CMAKE_CXX_COMPILER: "{{ mpi_root }}/bin/mpicxx"
  block:
    - name: Download GROMACS {{ version_number }}
      ansible.builtin.get_url:
        url: "{{ url }}"
        dest: "{{ common_src }}/gromacs-{{ version_number }}.tar.gz"
        checksum: "{{ checksum }}"
        mode: u=rw,g=r,o=r
    - name: Unzip GROMACS {{ version_number }}
      ansible.builtin.unarchive:
        src: "{{ common_src }}/gromacs-{{ version_number }}.tar.gz"
        dest: "/dev/shm/"
        creates: "{{ unzipdir }}"
    - name: Ensure GROMACS build directory is present {{ build_dir }}
      ansible.builtin.file:
        path: "{{ build_dir }}"
        state: directory
        mode: u=rwx,g=rwx,o=rx
    - name: Run cmake for GROMACS {{ version_number }}
      ansible.builtin.command: "cmake .. -DCMAKE_INSTALL_PREFIX:PATH={{ install_dir }} -DGMX_HWLOC=ON -DGMX_BUILD_OWN_FFTW=ON -DREGRESSIONTEST_DOWNLOAD=ON -DGMX_MPI=off
        -DGMX_GPU=CUDA -DCUDA_TOOLKIT_ROOT_DIR={{ cuda_root }} -DGMX_THREAD_MPI=on"
      args:
        chdir: "{{ build_dir }}"
        creates: "{{ build_dir }}/Makefile"

    - name: Build GROMACS {{ version_number }}
      community.general.make:
        chdir: "{{ build_dir }}"
        target: "all"

    - name: Install GROMACS {{ version_number }} to {{ install_dir }}
      community.general.make:
        chdir: "{{ build_dir }}"
        target: "install"

    - name: Check GROMACS module dir
      ansible.builtin.file:
        path: "{{ gromacs_module_dir }}"
        state: directory
        mode: u=rwx,g=rwx,o=rx
    - name: Install GROMACS module file {{ version_number }}
      ansible.builtin.template:
        src: gromacs.lua
        dest: "{{ gromacs_module_dir }}/{{ version_number }}.lua"
        mode: u=rw,g=r,o=r
