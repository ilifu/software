include required(classpath("application"))

backend {
  default = "SLURM"

  providers {
    SLURM {
      actor-factory = "cromwell.backend.impl.sfs.config.ConfigBackendLifecycleActorFactory"
      config {
        # `cpu` and `docker` are Cromwell's standard runtime-attribute names; a WDL
        # `runtime { cpu: 4, docker: "..." }` is only honoured if they are declared here.
        runtime-attributes = """
        Int runtime_minutes = 600
        Int cpu = 2
        Int requested_memory_mb_per_core = 7100
        String queue = "Main"
        String? docker
        """

        submit = """
            sbatch \
              -J ${job_name} \
              -D ${cwd} \
              -o ${out} \
              -e ${err} \
              -t ${runtime_minutes} \
              -p ${queue} \
              ${"-c " + cpu} \
              --mem-per-cpu ${requested_memory_mb_per_core} \
              --wrap "/bin/bash ${script}"
        """

        # Used instead of `submit` for tasks that set a `docker` runtime attribute:
        # pull the image once into the user's Singularity cache, then run the task
        # inside it. Bash variables are written bare ($IMAGE), never with braces:
        # Cromwell interpolates the braced form itself before bash sees the script.
        submit-docker = """
            # Cache pulled images per user, on scratch rather than quota-limited $HOME.
            if [ -z "$SINGULARITY_CACHEDIR" ]; then
              CACHE_DIR=/scratch3/users/$USER/.singularity/cache
            else
              CACHE_DIR=$SINGULARITY_CACHEDIR
            fi
            mkdir -p $CACHE_DIR
            LOCK_FILE=$CACHE_DIR/singularity_pull_flock
            # NOTE: review flagged that the docker value is interpolated unescaped.
            # Cromwell runs as the user who wrote the WDL, on their own account, so a
            # hostile value can only run commands they could already run; the script
            # and cwd values are interpolated the same way. No trust boundary here.
            # NOTE: review flagged that mapping '/' to '_' is not a unique encoding
            # (a/b:t and a_b:t collide). Registry hostnames and Docker Hub namespaces
            # cannot contain '_', so no two valid references collide in practice, and
            # a readable cache filename is worth more than a hash.
            IMAGE=$CACHE_DIR/$(echo ${docker} | sed 's/\//_/g').sif

            # Check for the image inside the lock so concurrent tasks (a scatter, say)
            # pull it exactly once, rather than each re-pulling over an image that
            # earlier tasks are already running from. Pull to a temp file and rename
            # so an interrupted pull never leaves a partial .sif for later tasks to
            # trust. flock --verbose and the echos land in stdout.submit.
            (
              flock --verbose --exclusive --timeout 900 9 || exit 1
              if [ -f $IMAGE ]; then
                echo "Image $IMAGE already exists."
              else
                singularity pull --force $IMAGE.tmp docker://${docker} \
                  && mv $IMAGE.tmp $IMAGE \
                  && echo "successfully pulled ${docker}!"
              fi
            ) 9>$LOCK_FILE || { echo "Failed to pull ${docker}" >&2; exit 1; }

            # Submit the script to SLURM. `singularity` here and above comes from the
            # unversioned `singularity` module that cromwell.lua loads; sbatch exports
            # the submitting environment into the job, so no path is hard-coded.
            # No wait flag (unlike the upstream docs example): the submit returns at once
            # so Cromwell learns the job id, can scancel it on abort, and detects
            # completion through check-alive and the rc file exactly as `submit` does.
            sbatch \
              -J ${job_name} \
              -D ${cwd} \
              -o ${cwd}/execution/stdout \
              -e ${cwd}/execution/stderr \
              -t ${runtime_minutes} \
              -p ${queue} \
              ${"-c " + cpu} \
              --mem-per-cpu=${requested_memory_mb_per_core} \
              --wrap "singularity exec --bind {{ software_root }}:{{ software_root }} --bind ${cwd}:${docker_cwd} $IMAGE ${job_shell} ${docker_script}"
        """

        kill = "scancel ${job_id}"
        check-alive = "squeue -j ${job_id}"
        job-id-regex = "Submitted batch job (\\d+).*"
      }
    }
  }
}
